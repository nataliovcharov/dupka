# production on the server, see docs/deployment.md
# docker compose -f compose.prod.yaml --env-file .env.prod up -d --build

# own project name, so it never touches the development containers in compose.yaml
name: dupka-prod

x-backend: &backend
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    CORS_ORIGINS: ${CORS_ORIGINS}
    STORAGE_DIR: /data/photos
    MODEL_PATH: /models/e001-best.pt
    FACE_MODEL_PATH: /models/face_detection_yunet_2023mar.onnx
    PLATE_MODEL_PATH: /models/yolo-v9-s-608-license-plates-end2end.onnx

services:
  db:
    build: deploy/db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no ports: only the other services can reach it

  # runs the migrations once, the api waits for it
  migrate:
    <<: *backend
    build: { context: backend, target: api }
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    build: { context: backend, target: api }
    volumes:
      - photos:/data/photos
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    build: { context: backend, target: worker }
    volumes:
      - photos:/data/photos
      - ./ml/models:/models:ro
      - hf-cache:/cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    # 80 and 443 on the server, changeable for testing on a machine that uses them
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  photos:
  hf-cache:
  caddy-data:
  caddy-config:
