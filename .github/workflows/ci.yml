name: CI

on:
  pull_request:
  push:
    branches: [main]

# read-only token, the workflow doesn't need to write anything
permissions:
  contents: read

# cancel older runs when new commits are pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: dupka
          POSTGRES_PASSWORD: dupka
          POSTGRES_DB: dupka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dupka -d dupka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dupka:dupka@localhost:5432/dupka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head # new: create the tables in the empty CI database
      - run: uv run alembic check # new: fail if models and migrations don't match
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # only the dev tools, installing PyTorch just to lint would be slow
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
