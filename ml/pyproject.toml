[project]
name = "dupka-ml"
version = "0.1.0"
description = "Road damage detection model for Dupka"
requires-python = ">=3.13"
dependencies = [
    "ultralytics>=8.4.165",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["convert_rdd_to_yolo"]

[tool.ruff.lint.per-file-ignores]
# long shell commands in notebooks
"*.ipynb" = ["E501"]
